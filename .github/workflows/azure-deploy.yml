name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: smart-parking-app
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure Login (Federated Credentials - No Keys!)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stop App Service (avoid 409 conflicts)
        run: |
          echo "🛑 Stopping app service to prevent deployment conflicts..."
          az webapp stop \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group smart-parking-rg
          echo "⏳ Waiting 10 seconds for graceful shutdown..."
          sleep 10

      - name: Ensure App Service Stopped (poll until Stopped)
        run: |
          echo "Checking app status until stopped (timeout after 60s)..."
          for i in {1..12}; do
            state=$(az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group smart-parking-rg --query "state" -o tsv)
            echo "Current app state: $state"
            if [[ "$state" == "Stopped" ]]; then
              echo "App is stopped. Proceeding with deployment."
              break
            fi
            echo "Waiting for app to stop... (attempt $i)"
            sleep 5
          done
          if [[ "$state" != "Stopped" ]]; then
            echo "Warning: app still not stopped (state: $state) — continuing anyway"
          fi

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        continue-on-error: true
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      - name: Fallback: Zip-deploy if OneDeploy failed
        if: ${{ steps.deploy.outcome == 'failure' }}
        run: |
          echo "OneDeploy action failed — attempting fallback with az webapp deployment config-zip"
          echo "Creating zip package..."
          zip -r app_package.zip .
          echo "Uploading zip to web app via az..."
          az webapp deployment source config-zip --resource-group smart-parking-rg --name ${{ env.AZURE_WEBAPP_NAME }} --src app_package.zip
          echo "Fallback zip deploy completed."

      - name: Start App Service
        run: |
          echo "▶️ Starting app service..."
          az webapp start \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group smart-parking-rg
          echo "✅ App service started successfully"


      - name: Configure App Settings
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group smart-parking-rg \
            --settings \
              FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              WEBSITES_PORT=8000

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "✅ Deployment Successful!"
          echo "=========================================="
          echo ""
          echo "🌐 URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "💰 Cost: ~$0/month on Free tier (B1 Basic: ~$13/month)"
          echo "🔒 Security: Federated Credentials (No stored keys!)"
          echo ""
          echo "=========================================="
